name: validate-json

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: validate against schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: |
          uvx check-jsonschema --schemafile schema.json version.json versions/*/latest.json versions/*/*/*.json
      - run: uvx openapi-spec-validator openapi.yaml
      - run: uv run check.py
