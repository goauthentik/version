name: validate-json

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: validate against schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: |
          uvx check-jsonschema --schemafile schema.json version.json versions/*/latest.json versions/*/*/*.json
      - run: uvx openapi-spec-validator openapi.yaml
      - run: uv run check.py
