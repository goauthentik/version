name: validate-json

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: validate against schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          uvx check-jsonschema --schemafile schema.json version.json versions/*/latest.json versions/*/*/*.json
      - run: uvx openapi-spec-validator openapi.yaml
      - run: uv run check.py
