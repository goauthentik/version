name: validate-json

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: validate against schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: |
          uvx check-jsonschema --schemafile schema.json version.json versions/*/latest.json versions/*/*/*.json
      - run: uvx openapi-spec-validator openapi.yaml
      - run: uv run check.py
