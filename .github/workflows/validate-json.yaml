name: validate-json

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: validate against schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: |
          shopt -s globstar
          uvx check-jsonschema --schemafile schema.json version.json versions/**/*.json
